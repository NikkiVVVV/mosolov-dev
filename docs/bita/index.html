<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f4f1"><title>Фишки</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="brand-dot"></span>Фишки</div><div class="head-actions"><button class="collection" id="collection" aria-label="Коллекция">В коллекции <b id="total">0</b></button><button id="theme" class="icon" aria-label="Сменить тему" aria-pressed="false"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg></button></div></header>
<main id="stage" aria-label="Игровой стол: потяните биту и отпустите"><div id="loading">Раскладываем фишки…</div></main>
<div id="announcement" role="status" aria-live="polite"></div>
<section class="controls"><div id="tray" aria-label="Собранные фишки"></div><p id="hint">Потяни биту и отпусти</p><div class="control-row"><div class="stepper"><button id="minus" disabled aria-label="Убрать фишку">−</button><span><b id="count">6</b><small id="countLabel">в стопке</small></span><button id="plus" disabled aria-label="Добавить фишку">+</button></div><button id="strike" disabled class="primary"><span id="buttonText">Ударить</span><span class="charge"></span></button></div><button id="again" class="text-button" hidden>Собрать стопку</button></section>
<dialog id="album"><div class="album-head"><h2>Коллекция <span id="albumCount">0</span></h2><button id="closeAlbum" class="icon" aria-label="Закрыть коллекцию">×</button></div><div id="albumGrid"></div><p id="emptyAlbum">Перевернувшиеся фишки — твои</p></dialog>
<script type="module" src="app.js"></script></body></html>
